name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                php-version: ['7.4', '8.0', '8.1', '8.2']
                node-version: ['18', '20']

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, xml, ctype, json, fileinfo, tokenizer
                  tools: composer

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            - name: Install NPM dependencies
              run: npm ci

            - name: Lint PHP code
              run: composer lint

            - name: Analyze PHP code with PHPStan
              run: composer analyze

            - name: Lint JavaScript code
              run: npm run lint:js

            - name: Lint CSS code
              run: npm run lint:css

            - name: Run PHP tests
              run: composer test

            - name: Run JavaScript tests
              run: npm run test:unit

            - name: Build plugin
              run: npm run build

    visual-regression:
        runs-on: ubuntu-latest
        needs: lint-and-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests
              run: npm run test:e2e

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

    security-scan:
        runs-on: ubuntu-latest
        needs: lint-and-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  tools: composer

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Security audit for Composer
              run: composer audit

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install NPM dependencies
              run: npm ci

            - name: Security audit for NPM
              run: npm audit

    build-and-package:
        runs-on: ubuntu-latest
        needs: [lint-and-test, visual-regression, security-scan]
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Create plugin ZIP
              run: npm run plugin-zip

            - name: Upload plugin artifact
              uses: actions/upload-artifact@v4
              with:
                  name: weather-block-plugin
                  path: '*.zip'
                  retention-days: 90
